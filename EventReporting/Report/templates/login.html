{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block head %}
<style>
  .login-wrap { max-width: 420px; margin: 40px auto 0; }
  .login-icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--ns-sky); color: var(--ns-navy);
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 14px;
  }
  .login-wrap h1 { font-size: 1.3rem; font-weight: 600; color: var(--ns-navy); text-align: center; margin-bottom: 4px; }
  .login-wrap .sub { text-align: center; color: var(--ns-muted); font-size: .9rem; margin-bottom: 22px; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="ns-card">
    <div class="card-body" style="padding: 32px 32px 28px;">
      <div class="login-icon"><i class="fas fa-lock"></i></div>
      <h1>Login</h1>
      <p class="sub">Sign in to view and manage event reports.</p>

      <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="ns-label" for="id_username">Username</label>
          <input type="text" class="form-control" id="id_username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="form-group">
          <label class="ns-label" for="id_password">Password</label>
          <input type="password" class="form-control" id="id_password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-ns btn-block mt-3">Sign In</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
